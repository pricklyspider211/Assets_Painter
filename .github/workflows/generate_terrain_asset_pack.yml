name: Generate terrain asset pack

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/generate_terrain_asset_pack.py'
      - '.github/workflows/generate_terrain_asset_pack.yml'

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow trimesh numpy

      - name: Generate terrain asset pack
        run: |
          python tools/generate_terrain_asset_pack.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated_assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Generate terrain asset pack"
            git push
          fi
